<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HBlive · MTV Hondelage Herren</title>
  <meta name="description" content="Spielplan, Ergebnisse und Tabellen der 1. und 2. Herren des MTV Hondelage – automatisch aktualisiert aus nuLiga.">
  <meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c9cff5'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%233d4aa8' stroke-width='2.4'/%3E%3Cpath d='M9 13.5c4 1.8 10 1.8 14 0M9 18.5c4-1.8 10-1.8 14 0' fill='none' stroke='%233d4aa8' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M5.2 9.6c4.2 1.8 9.4 1.8 13.6 0M5.2 14.4c4.2-1.8 9.4-1.8 13.6 0"/></svg>
        </span>
        <div class="brand-text">
          <h1>MTV Hondelage</h1>
          <p class="sub" id="season">Herren</p>
        </div>
      </div>
      <div class="actions">
        <span class="status" aria-live="polite">
          <span class="dot" id="status-dot" aria-hidden="true"></span>
          <span id="status-text">lädt …</span>
        </span>
        <button class="btn icon glass" id="refresh-btn" type="button" title="Jetzt aktualisieren" aria-label="Jetzt aktualisieren">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v3.8h-3.8"/></svg>
        </button>
        <a class="btn icon glass" id="ics-link" href="calendar.ics" title="Alle Spiele als Kalender abonnieren" aria-label="Kalender abonnieren">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        </a>
        <button class="btn icon glass" id="theme-btn" type="button" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabbar glass" aria-label="Mannschaft wählen">
      <div class="segmented" id="team-filter" role="tablist"></div>
    </nav>

    <section id="today" class="today" hidden aria-label="Spiele heute"></section>

    <section class="teams" id="teams" aria-label="Mannschaften"></section>

    <section class="panel glass" aria-labelledby="schedule-h">
      <div class="panel-head">
        <h2 id="schedule-h">Spielplan</h2>
        <div class="segmented small" id="schedule-filter" role="tablist" aria-label="Spiele filtern">
          <button type="button" data-v="upcoming" role="tab">Kommende</button>
          <button type="button" data-v="results" role="tab">Ergebnisse</button>
          <button type="button" data-v="all" role="tab">Alle</button>
        </div>
      </div>
      <div id="schedule"></div>
    </section>

    <section class="tables" id="tables" aria-label="Tabellen"></section>

    <footer class="footer">
      <p>Daten: <a id="source-link" href="https://hvnb-handball.liga.nu" target="_blank" rel="noopener">nuLiga · HVNB</a>.
        Ergebnisse erscheinen mit dem Spielbericht. <span id="generated"></span></p>
    </footer>
  </main>

  <div class="toast glass" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
